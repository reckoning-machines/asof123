[project]
name = "asof123"
version = "0.0.1"
description = "Temporal semantics layer for financial and institutional systems"
requires-python = ">=3.11"
authors = [{ name = "asof123 contributors" }]
readme = "README.md"
dependencies = [
  "pydantic>=2.6",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "httpx>=0.27"]
serve = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27"]

[project.scripts]
asof123 = "asof123.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
